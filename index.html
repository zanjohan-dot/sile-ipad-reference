<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15324a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SILE 2026">
<link rel="manifest" href="/sile-ipad-reference/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/sile-ipad-reference/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<title>SILE Part B 2026</title>
</head>
<body>
<header class="topbar">
  <div class="brand"><b>SILE Part B 2026</b><span id="contextLabel">Offline reference</span></div>
  <div class="mode">
    <button data-mode="rapid" class="active">Rapid</button>
    <button data-mode="learn">Learn</button>
  </div>
  <button id="statusBtn" class="status">No data</button>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="paperTabs">
      <button data-paper="1" class="active">Paper 1</button>
      <button data-paper="2">Paper 2</button>
    </div>
    <div class="navLabel">Subjects</div>
    <nav id="subjects"></nav>
    <div class="sideActions">
      <button id="toolsBtn">Tools & calculators</button>
      <button id="dataBtn">Data & offline status</button>
    </div>
  </aside>

  <main class="workspace">
    <div class="searchBar">
      <div>
        <label for="search">Search</label>
        <input id="search" type="search" autocomplete="off" placeholder="Rule, section, deadline, question, trap…">
      </div>
      <div class="filters">
        <button data-filter="" class="filterChip active">All</button>
        <button data-filter="RULE" class="filterChip">Rules</button>
        <button data-filter="QUESTION" class="filterChip">Questions</button>
        <button data-filter="DEADLINE" class="filterChip">Deadlines</button>
        <button data-filter="TRAP" class="filterChip">Traps</button>
      </div>
    </div>

    <div id="workspaceBody" class="workspaceBody">
      <section id="screen"></section>
    </div>
  </main>
</div>

<input id="fileInput" type="file" accept="application/json,.json" hidden>
<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js" defer></script>
</body>
</html>
