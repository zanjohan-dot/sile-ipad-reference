<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17324a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SILE 2026">
<link rel="manifest" href="/sile-ipad-reference/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/sile-ipad-reference/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<title>SILE Part B 2026</title>
</head>
<body>
<header class="appHeader">
  <div class="brandBlock">
    <div class="brandTitle">SILE Part B 2026</div>
    <div id="contextLabel" class="brandContext">Offline reference</div>
  </div>
  <div class="modeSwitch" aria-label="Study mode">
    <button data-mode="rapid" class="active">Rapid</button>
    <button data-mode="learn">Learn</button>
  </div>
  <button id="stuckBtn" class="headerAction urgentAction">Stuck? Find rule</button>
  <button id="searchBtn" class="headerAction">Search</button>
  <button id="aiBtn" class="headerAction secondaryAction">Offline AI</button>
  <button id="statusBtn" class="offlineBadge">No data</button>
</header>

<div class="appShell">
  <aside id="sidebar" class="sidebar">
    <div class="paperSwitch">
      <button data-paper="1" class="active">Paper 1</button>
      <button data-paper="2">Paper 2</button>
    </div>
    <div class="sideLabel">Subjects</div>
    <nav id="subjects" class="subjectNav"></nav>
    <div class="sideFooter">
      <button id="toolsBtn" class="sideUtility">Tools</button>
      <button id="dataBtn" class="sideUtility">Offline data</button>
    </div>
  </aside>

  <main class="mainArea">
    <div id="screen" class="screen"></div>
  </main>
</div>

<input id="fileInput" type="file" accept="application/json,.json" hidden>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="tools-enhancements.js" defer></script>
<script src="retrieval-enhancements.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
